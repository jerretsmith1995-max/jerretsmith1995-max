<meta name="claude:viewport-fit-sides" content="cover">
<title>Sonny's Story Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: a one-screen bedtime app in a single phone-width column. Slim header,
   a stage that holds one activity at a time, one thumb-sized button at the bottom.
   Deliberately a single dark look: warm and low-glare for a dark bedroom. */
:root{
  color-scheme:dark;
  --night:#15132e; --night-2:#1f1c44; --panel:#2a2658; --line:#423d80;
  --ink:#f5eedf; --ink-soft:#b9b2d4;
  --glow:#ffc95c; --ember:#ff8f6b; --leaf:#8fe0b0; --veil:rgba(21,19,46,.97);
  --display:'Fredoka','Trebuchet MS','Avenir Next',sans-serif;
  --read:'Andika','Comic Sans MS','Century Gothic',sans-serif; /* single-storey a and g, made for new readers */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--read);font-size:16px;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,var(--ink) 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,var(--ink) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 30%,var(--ink-soft) 50%,transparent 51%),
    radial-gradient(1px 1px at 30% 44%,var(--ink-soft) 50%,transparent 51%),
    radial-gradient(1px 1px at 90% 52%,var(--ink) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 8% 70%,var(--ink-soft) 50%,transparent 51%),
    radial-gradient(1px 1px at 48% 84%,var(--ink) 50%,transparent 51%),
    linear-gradient(var(--night),var(--night-2));
  background-attachment:fixed;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,label:focus-within{outline:3px solid var(--glow);outline-offset:3px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1} h2{font-size:20px} h3{font-size:16px;color:var(--glow)}
p{margin:0;line-height:1.5}
.soft{color:var(--ink-soft)}

/* avatars */
.av{border-radius:50%;background:var(--panel);border:3px solid var(--line);overflow:hidden;flex:none;display:block}
.av img,.av svg{width:100%;height:100%;display:block;object-fit:cover}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.family{display:flex;gap:10px;justify-content:space-between}
.family figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink-soft)}
.tonight{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tonight .big{font-family:var(--read);font-weight:700;font-size:64px;line-height:1;color:var(--glow)}
.tonight .row{display:flex;align-items:center;gap:16px}
.go{background:var(--glow);color:var(--night);font-family:var(--display);font-weight:600;font-size:20px;border-radius:999px;padding:16px 24px;width:100%;min-height:58px}
.go.quiet{background:var(--panel);color:var(--ink-soft);border:2px solid var(--line)}
.go.ready{background:var(--glow);color:var(--night);border:0;animation:pulse 1.6s ease-in-out infinite}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.node{aspect-ratio:1;border-radius:50%;background:var(--night-2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.node .l{font-weight:700;font-size:22px;line-height:1.1}
.node .n{font-size:11px;color:var(--ink-soft)}
.node.done{border-color:var(--leaf)} .node.done .l{font-size:30px}
.node.next{border-color:var(--glow);box-shadow:0 0 0 4px rgba(255,201,92,.18)}
.link{color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;font-size:15px;padding:10px;align-self:center}

/* play chrome */
.bar{flex:1;height:8px;border-radius:8px;background:var(--panel);overflow:hidden}
.bar i{display:block;height:100%;background:var(--glow);border-radius:8px;transition:width .4s}
.x{width:44px;height:44px;border-radius:50%;background:var(--panel);font-size:20px;color:var(--ink-soft);flex:none}
#stage{align-items:center;text-align:center}
.foot{display:flex;gap:10px}
.foot .back{flex:none;width:58px;border-radius:50%;background:var(--panel);color:var(--ink-soft);font-size:22px}
.ask{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.25;text-wrap:balance}
.cue{background:var(--night-2);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--ink-soft);text-align:left;width:100%}
.cue b{color:var(--ember);font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px;display:block}
.hl{color:var(--glow);font-weight:700}

/* meet */
.letter-card{width:200px;height:200px;border-radius:40px;background:var(--panel);border:3px solid var(--glow);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--glow);font-size:110px;line-height:1;flex:none}
.letter-card small{font-size:64px;color:var(--ink-soft);font-weight:700}
.pop{animation:pop .45s}
.keys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.key{background:var(--night-2);border:2px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;min-width:92px}
.key .pic{font-size:44px;line-height:1.1}

/* trace */
.trace{position:relative;border-radius:32px;background:var(--panel);border:3px solid var(--line);touch-action:none;flex:none}
.trace canvas{display:block;border-radius:30px;touch-action:none}
.mini{font-size:14px;color:var(--ink-soft);text-decoration:underline;padding:8px}

/* find */
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:330px}
.egg{aspect-ratio:.85;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:var(--ink);color:var(--night);font-weight:700;font-size:44px;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .3s}
.egg.hit{background:var(--glow);animation:pop .45s}
.egg.miss{animation:wob .4s;opacity:.45}

/* sort */
.pair{display:flex;gap:14px;width:100%;justify-content:center}
.pick{flex:1;max-width:170px;background:var(--panel);border:3px solid var(--line);border-radius:28px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:26px}
.pick .pic{font-size:72px;line-height:1.1}
.pick.yes{border-color:var(--leaf);animation:pop .45s}
.pick.no{animation:wob .4s;opacity:.4}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;border-radius:16px;background:var(--panel);border:2px solid var(--glow);color:var(--glow);font-weight:700;font-size:36px;padding:0 10px;vertical-align:middle}

/* review */
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:340px}
.tile{width:72px;height:84px;border-radius:20px;background:var(--panel);border:3px solid var(--line);font-weight:700;font-size:48px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.tile.lit{border-color:var(--glow);color:var(--glow);animation:pop .45s}

/* blend */
.blend{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.sounds{display:flex;transition:gap .5s,padding .5s}
.sounds button{flex:1;font-weight:700;font-size:92px;line-height:1.2;color:var(--ink-soft);transition:color .2s,flex .5s}
.sounds button.lit{color:var(--glow)}
.sounds.done{justify-content:center}
.sounds.done button{flex:0 0 auto}
.track{position:relative;height:64px;border-radius:999px;background:var(--panel);border:2px solid var(--line);touch-action:none}
.track::before{content:"";position:absolute;left:28px;right:28px;top:50%;border-top:3px dotted var(--line)}
.thumb{position:absolute;top:50%;left:0;width:56px;height:56px;margin:-28px 0 0 2px;border-radius:50%;background:var(--glow);font-size:32px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.reveal{min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;line-height:1.1}

/* story */
.scene{width:100%;border-radius:28px;background:radial-gradient(circle at 80% 20%,var(--line),var(--panel) 60%);padding:18px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:60px;line-height:1.1;min-height:128px;flex:none}
.text{font-size:26px;line-height:1.55;text-align:left;width:100%}
.text .w{border-radius:8px;padding:0 1px}
.text .w.said{background:var(--line)}
.text .read{display:inline-block;font-weight:700;font-size:40px;line-height:1.15;color:var(--glow);background:var(--panel);border:2px solid var(--glow);border-radius:14px;padding:2px 12px;margin:2px 0}
.text .read.said{background:var(--glow);color:var(--night)}
.hear{align-self:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;color:var(--ink-soft)}

/* reward and sleep */
.sticker{font-size:130px;line-height:1.1;animation:pop .7s}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--ember),transparent 70%);display:flex;align-items:center;justify-content:center;font-size:64px;animation:breathe 8s ease-in-out infinite;flex:none;margin:24px 0}

/* grown-ups */
.card{background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.photo-row{display:flex;align-items:center;gap:12px}
.photo-row .name{flex:1;font-size:18px}
.btn{background:var(--night-2);border:2px solid var(--line);border-radius:999px;padding:10px 16px;font-size:15px;min-height:44px;display:inline-flex;align-items:center;cursor:pointer}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* living things: everything he can tap moves and answers back */
#play{position:relative}
.buddy{width:44px;height:44px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:26px;flex:none;display:flex;align-items:center;justify-content:center}
.buddy.talk{border-color:var(--glow);animation:talk .35s ease-in-out infinite}
.actor{font-size:inherit;line-height:1.1;display:inline-flex;animation:float 3.2s ease-in-out infinite}
.actor:nth-child(2n){animation-delay:-1.1s}
.actor:nth-child(3n){animation-delay:-2s}
.a-jump{animation:jump .6s!important}
.a-spin{animation:spin .7s!important}
.a-wiggle{animation:wob .25s 3!important}
.a-grow{animation:grow .6s!important}
.bit{position:fixed;left:0;top:0;pointer-events:none;font-size:20px;z-index:50}
.hunt{font-size:15px;color:var(--ink-soft);align-self:flex-start;text-align:left}
.hunt b{color:var(--glow)}
.text .w{display:inline-block}
.text .w.now{background:var(--line);color:var(--glow)}
.text .w.got{color:var(--glow)}
.over{position:absolute;inset:0;z-index:20;background:var(--veil);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:16px}
.over .sounds{width:100%;max-width:340px}
.buddies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bud{background:var(--night-2);border:2px solid var(--line);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--ink-soft)}
.bud .pic{font-size:36px;line-height:1.1}
.bud.on{border-color:var(--glow);color:var(--ink)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(1.15)}60%{transform:translateY(0) scale(1.08,.9)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
@keyframes grow{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes talk{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,92,.5)}50%{box-shadow:0 0 0 12px rgba(255,201,92,0)}}
@keyframes breathe{0%,100%{transform:scale(.7)}45%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <section class="view" id="home">
    <div class="top">
      <h1>Sonny's Story Quest</h1>
      <button class="x" id="toGrown" aria-label="For grown-ups">⚙</button>
    </div>
    <div class="scroll">
      <div class="family" id="family"></div>
      <div class="tonight" id="tonight"></div>
      <h3>Who reads tonight? Tap to hear them</h3>
      <div class="buddies" id="buddies"></div>
      <h3>Sticker trail</h3>
      <div class="path" id="path"></div>
      <button class="link" id="toGrown2">How this works (for grown-ups)</button>
    </div>
  </section>

  <section class="view" id="play" hidden>
    <div class="top">
      <button class="x" id="quit" aria-label="Back to the start">✕</button>
      <div class="bar"><i id="barFill"></i></div>
      <button class="buddy" id="buddy" aria-label="Story friend"></button>
    </div>
    <div class="scroll" id="stage"></div>
    <div class="foot">
      <button class="back" id="prev" aria-label="Go back one step">‹</button>
      <button class="go quiet" id="next">Next</button>
    </div>
  </section>

  <section class="view" id="grown" hidden>
    <div class="top">
      <h1>For grown-ups</h1>
      <button class="x" id="closeGrown" aria-label="Close">✕</button>
    </div>
    <div class="scroll" id="grownBody"></div>
  </section>
</div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const el=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;};
const store={
  get(k,d){try{const v=localStorage.getItem('ssq_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('ssq_'+k,JSON.stringify(v));return true;}catch(e){return false;}},
  del(k){try{localStorage.removeItem('ssq_'+k);}catch(e){}}
};
let progress=store.get('progress',{done:{},voice:true});
if(!progress.done)progress.done={};
const save=()=>store.set('progress',progress);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- voice (optional: the grown-up is the main voice) ---------- */
const canSpeak='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
/* Three story friends, each with their own voice. `pref` picks the best-matching voice the phone has. */
const BUDDIES={
  hero:{name:'Night Hero',e:'🦸',pitch:.7,rate:.82,pref:/Ralph|Aaron|Daniel|Reed|Rocko|Fred|Male/i,hi:'Hello Sonny. I am the Night Hero. Let us read.',yay:['Super reading, Sonny.','You are a reading hero.','Hero power!']},
  monster:{name:'Grumble',e:'👾',pitch:.1,rate:.62,pref:/Albert|Grandpa|Ralph|Fred|Daniel/i,hi:'Grrr. Hello Sonny. I am Grumble. I love stories.',yay:['Grrr. Good job.','Grumble is so proud.','Monster high five!']},
  dragon:{name:'Spark',e:'🐉',pitch:1.8,rate:.95,pref:/Junior|Bubbles|Princess|Karen|Samantha|Kathy|Female/i,hi:'Hi Sonny! I am Spark the dragon! Story time!',yay:['Wheee! You did it!','Roar! So good!','Sparkly reading, Sonny!']}
};
if(!BUDDIES[progress.buddy])progress.buddy='hero';
const buddy=()=>BUDDIES[progress.buddy];
if(canSpeak){try{speechSynthesis.getVoices();}catch(e){}}
let speakId=0;
function talking(on){const b=document.getElementById('buddy');if(b)b.classList.toggle('talk',on);}
function speak(text,opt){
  opt=opt||{};
  if(!canSpeak||!progress.voice){if(opt.onend)opt.onend();return false;}
  try{
    stopAudio();speechSynthesis.cancel();
    const B=buddy(),id=++speakId,u=new SpeechSynthesisUtterance(text);
    const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    const v=vs.find(v=>B.pref.test(v.name))||vs.find(v=>/^en[-_](CA|US|GB)/i.test(v.lang))||vs[0];
    if(v){u.voice=v;u.lang=v.lang;}
    u.rate=B.rate;u.pitch=B.pitch;
    u.onboundary=e=>{if(id===speakId&&opt.onword&&e.name!=='sentence')opt.onword(e.charIndex);};
    u.onend=u.onerror=()=>{if(id!==speakId)return;talking(false);if(opt.onend)opt.onend();};
    talking(true);speechSynthesis.speak(u);return true;
  }catch(e){talking(false);return false;}
}

/* ---------- recorded voices ----------
   Each friend has one recording per story page (with the time of every word)
   and one long recording, bits.mp3, holding every single word and phrase.
   If the recordings can't be loaded, the phone's own voice is used instead. */
let AUD=null;
try{fetch('audio/index.json').then(r=>r.ok?r.json():null).then(j=>{AUD=j;}).catch(()=>{});}catch(e){}
const players={};let playing=null,playId=0;
function getAudio(url){let a=players[url];if(!a){a=players[url]=new Audio();a.preload='auto';a.src=url;}return a;}
function stopAudio(){playId++;if(playing){try{playing.pause();}catch(e){}playing=null;}talking(false);}
function playSeg(url,from,to,opt){
  opt=opt||{};stopAudio();try{speechSynthesis.cancel();}catch(e){}
  const a=getAudio(url),id=playId;let seeked=false;playing=a;
  const fail=()=>{if(id!==playId)return;stopAudio();if(opt.onfail)opt.onfail();};
  const seek=()=>{try{a.currentTime=Math.max(0,from);}catch(e){}a.muted=false;seeked=true;};
  if(a.readyState>=1)seek();else{a.muted=true;a.addEventListener('loadedmetadata',()=>{if(id===playId)seek();},{once:true});}
  a.onerror=fail;
  try{const pr=a.play();if(pr&&pr.catch)pr.catch(fail);}catch(e){fail();return;}
  talking(true);
  (function loop(){
    if(id!==playId)return;
    if(seeked){const t=a.currentTime;if(opt.ontime)opt.ontime(t);if(a.ended||(to!=null&&t>=to)){stopAudio();if(opt.onend)opt.onend();return;}}
    requestAnimationFrame(loop);
  })();
}
const recorded=()=>(AUD&&progress.voice&&AUD[progress.buddy])||null;
/* say a word ('w:sat'), a picture phrase ('s:Boop!') or a friend's own line ('l:hi') */
function say(key,text,opt){
  const d=recorded(),seg=d&&d.bits[key];
  if(!seg)return speak(text,opt);
  playSeg(`audio/${progress.buddy}/bits.mp3`,seg[0],seg[1],{onend:opt&&opt.onend,onfail:()=>speak(text,opt)});
  return true;
}

/* ---------- little sounds (soft, made in the browser) ---------- */
let actx=null;
function tone(f1,f2,dur,type,vol){
  if(!progress.voice)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const sfx={
  pop:(n)=>tone(520*(1+(n||0)*.2),880*(1+(n||0)*.2),.09),
  boing:()=>tone(180,520,.22,'triangle'),
  nope:()=>tone(300,220,.15,'triangle',.06),
  chime:()=>{tone(880,880,.35);setTimeout(()=>tone(1320,1320,.45),110);},
  win:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,f,.3),i*110));}
};

/* ---------- movement ---------- */
const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function anim(n,name){
  const moves=['jump','spin','wiggle','grow'];name=name||moves[Math.floor(Math.random()*moves.length)];
  moves.forEach(m=>n.classList.remove('a-'+m));void n.offsetWidth;n.classList.add('a-'+name);
}
function burst(target,emo){
  if(calm||!target.animate)return;
  const r=target.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<8;i++){
    const b=document.createElement('span');b.className='bit';b.textContent=emo||'⭐';document.body.appendChild(b);

    b.animate([{transform:`translate(${cx-10}px,${cy-10}px) scale(.4)`,opacity:1},
      {transform:`translate(${cx-10+Math.cos(a)*d}px,${cy-10+Math.sin(a)*d}px) scale(1.1) rotate(${Math.round(Math.random()*240-120)}deg)`,opacity:0}],
      {duration:750,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>b.remove();
  }

/* ---------- story text ---------- */
function clean(w){return w.replace(/[^A-Za-z'-]/g,'');}
function storyHTML(t){
  return t.split(' ').map(tok=>{
    let m=tok.match(/^(["(]*)\[([^\]]+)\](.*)$/);
    if(m)return `${m[1]}<button class="w read" data-w="${m[2]}">${m[2]}</button>${m[3]}`;
    m=tok.match(/^(["(]*)\*(.)(.*)$/);
    if(m)return `<span class="w s" data-w="${clean(m[2]+m[3])}">${m[1]}<b class="hl">${m[2]}</b>${m[3]}</span>`;
    return `<span class="w" data-w="${clean(tok)}">${tok}</span>`;
  }).join(' ');
}
const plain=t=>t.replace(/[*\[\]]/g,'');

/* ---------- views ---------- */
const views=['home','play','grown'];
function show(v){views.forEach(id=>{$('#'+id).hidden=id!==v;});if(v==='home')renderHome();if(v==='grown')renderGrown();stopAudio();try{speechSynthesis.cancel();}catch(e){}}

function renderHome(){
  $('#family').innerHTML=Object.keys(FAMILY).map(k=>`<figure>${avatar(k,64)}<figcaption>${FAMILY[k].name}</figcaption></figure>`).join('');
  let next=NIGHTS.findIndex((n,i)=>!progress.done[i]);
  const all=next<0; if(all)next=0;
  const N=NIGHTS[next];
  $('#tonight').innerHTML=`<div class="row"><div class="big">${N.kind==='letter'?N.letter:N.sticker}</div>
    <div><p class="soft">${all?'All 12 nights done! Read one again':'Tonight · Night '+(next+1)}</p><h2>${N.title}</h2>
    <p class="soft">${N.kind==='letter'?'New sound: '+N.letter:'Slide sounds together to read words'} · about 5 minutes</p></div></div>
    <button class="go" id="start">Start the story</button>`;
  $('#start').onclick=()=>startNight(next);
  const bs=$('#buddies');bs.innerHTML='';
  Object.keys(BUDDIES).forEach(k=>{
    const B=BUDDIES[k],b=el(`<button class="bud ${k===progress.buddy?'on':''}"><span class="pic">${B.e}</span>${B.name}</button>`);
    b.onclick=()=>{progress.buddy=k;save();[...bs.children].forEach(c=>c.classList.toggle('on',c===b));anim(b.firstChild,'jump');sfx.boing();say('l:hi',B.hi);};
    bs.appendChild(b);
  });
  const path=$('#path');path.innerHTML='';
  NIGHTS.forEach((n,i)=>{
    const done=!!progress.done[i];
    const b=el(`<button class="node ${done?'done':''} ${i===next&&!all?'next':''}" aria-label="Night ${i+1}: ${n.title}"><span class="l">${done?n.sticker:(n.kind==='letter'?n.letter:n.label)}</span><span class="n">Night ${i+1}</span></button>`);
    b.onclick=()=>startNight(i);path.appendChild(b);
  });
}

/* ---------- a night ---------- */
let cur=null;
const stage=$('#stage'),nextBtn=$('#next');
function startNight(i){
  const N=NIGHTS[i],steps=[];
  if(N.kind==='letter'){steps.push({t:'meet'},{t:'trace'},{t:'find'});N.sort.forEach(r=>steps.push({t:'sort',r}));}
  else{steps.push({t:'review'});N.blend.forEach(b=>steps.push({t:'blend',b}));}
  N.story.forEach(p=>steps.push({t:'page',p}));
  steps.push({t:'reward'},{t:'sleep'});
  cur={i,N,steps,at:0};show('play');renderStep();
}
function ready(){nextBtn.classList.remove('quiet');nextBtn.classList.add('ready');}
function renderStep(){
  const s=cur.steps[cur.at];
  document.querySelectorAll('.over').forEach(o=>o.remove());stopAudio();
  $('#buddy').textContent=buddy().e;
  stage.innerHTML='';stage.scrollTop=0;
  $('#barFill').style.width=(100*(cur.at+1)/cur.steps.length)+'%';
  nextBtn.className='go quiet';
  nextBtn.textContent=cur.at===cur.steps.length-1?'Lights out':'Next';
  $('#prev').style.visibility=cur.at?'visible':'hidden';
  STEP[s.t](s,cur.N);
}
nextBtn.onclick=()=>{if(cur.at<cur.steps.length-1){cur.at++;renderStep();}else show('home');};
$('#prev').onclick=()=>{if(cur.at>0){cur.at--;renderStep();}};
$('#quit').onclick=()=>show('home');
$('#buddy').onclick=()=>{const b=$('#buddy'),y=buddy().yay,n=Math.floor(Math.random()*y.length);anim(b,'jump');sfx.boing();burst(b);say('l:yay'+n,y[n]);};
const add=(html)=>{const n=el(html);stage.appendChild(n);return n;};
const cue=(txt)=>add(`<div class="cue"><b>Grown-up</b>${txt}</div>`);
const pic=(k,size)=>k.who?avatar(k.who,size):`<span class="pic">${k.e}</span>`;

const STEP={
  meet(s,N){
    const L=N.letter;
    add(`<p class="ask">Tonight's sound</p>`);
    const card=add(`<button class="letter-card" aria-label="The letter ${L}">${L}<small>${L.toUpperCase()}</small></button>`);
    add(`<p class="soft">Tap the letter and say its sound</p>`);
    card.onclick=()=>{card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');sfx.pop();burst(card,'✨');ready();};
    const keys=add(`<div class="keys"></div>`);
    N.keys.forEach(k=>{
      const b=el(`<button class="key">${pic(k,52)}<span><b class="hl">${k.w[0]}</b>${k.w.slice(1)}</span></button>`);
      b.onclick=()=>{say('w:'+k.w.toLowerCase(),k.w);anim(b.firstChild);sfx.boing();};
      keys.appendChild(b);
    });
    cue(N.cue+' Then say each picture word and stretch the first sound.');
  },
  trace(s,N){
    const L=N.letter;
    add(`<p class="ask">Trace the <span class="hl">${L}</span> with your finger</p>`);
    const size=Math.min(stage.clientWidth,290),dpr=Math.min(window.devicePixelRatio||1,3);
    const wrap=add(`<div class="trace" style="width:${size+6}px;height:${size+6}px"><canvas width="${size*dpr}" height="${size*dpr}" style="width:${size}px;height:${size}px"></canvas></div>`);
    const again=add(`<button class="mini">Start again</button>`);
    cue('Say the sound each time his finger moves. Any wobbly line counts. Tracing links the shape to the sound.');
    const cv=$('canvas',wrap),ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const off=document.createElement('canvas');off.width=off.height=size;const o=off.getContext('2d',{willReadFrequently:true});
    const css=getComputedStyle(document.documentElement),glow=css.getPropertyValue('--glow').trim(),ink=css.getPropertyValue('--ink').trim();
    let pts=[],hits=0,fin=false,last=null;
    function setup(){
      o.globalCompositeOperation='source-over';o.clearRect(0,0,size,size);
      o.font=`700 ${Math.round(size*.82)}px Andika, "Comic Sans MS", sans-serif`;o.textAlign='center';o.fillStyle=ink;
      const m=o.measureText(L),y=size/2+((m.actualBoundingBoxAscent||size*.5)-(m.actualBoundingBoxDescent||0))/2;
      o.fillText(L,size/2,y);
      const d=o.getImageData(0,0,size,size).data;pts=[];hits=0;fin=false;
      for(let yy=4;yy<size;yy+=8)for(let x=4;x<size;x+=8)if(d[(yy*size+x)*4+3]>128)pts.push({x,y:yy,h:false});
      ctx.clearRect(0,0,size,size);ctx.globalAlpha=.25;ctx.drawImage(off,0,0);ctx.globalAlpha=1;
    }
    function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
    function mark(p){
      for(const q of pts){if(!q.h&&Math.abs(q.x-p.x)<17&&Math.abs(q.y-p.y)<17){q.h=true;hits++;}}
      if(!fin&&pts.length&&hits/pts.length>=.7){
        fin=true;o.globalCompositeOperation='source-in';o.fillStyle=glow;o.fillRect(0,0,size,size);
        ctx.clearRect(0,0,size,size);ctx.drawImage(off,0,0);wrap.classList.add('pop');sfx.win();burst(wrap);ready();
      }
    }
    cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}last=pos(e);mark(last);};
    cv.onpointermove=e=>{
      if(!last||fin)return;const p=pos(e);
      ctx.strokeStyle=glow;ctx.lineWidth=20;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;mark(p);
    };
    cv.onpointerup=cv.onpointercancel=()=>{last=null;};
    again.onclick=()=>{wrap.classList.remove('pop');setup();};
    setup();
    if(document.fonts&&document.fonts.load)document.fonts.load('700 100px Andika').then(()=>{if(!hits)setup();},()=>{});
  },
  find(s,N){
    const L=N.letter;
    add(`<p class="ask">Tap every egg with <span class="chip">${L}</span></p>`);
    const others=shuffle('satpinmdoce'.split('').filter(c=>c!==L)).slice(0,5);
    const grid=add(`<div class="eggs"></div>`);let left=4;
    shuffle([L,L,L,L].concat(others)).forEach(c=>{
      const b=el(`<button class="egg">${c}</button>`);
      b.onclick=()=>{
        if(b.classList.contains('hit'))return;
        if(c===L){b.classList.add('hit');b.innerHTML=N.sticker;burst(b);if(--left===0){sfx.win();ready();}else sfx.boing();}
        else{sfx.nope();b.classList.remove('miss');void b.offsetWidth;b.classList.add('miss');}
      };
      grid.appendChild(b);
    });
    cue('Let him hunt. If he taps a different letter, just say "that one says..." and keep going. No wrong answers at bedtime.');
  },
  sort(s,N){
    const L=N.letter,r=s.r;
    add(`<p class="ask">Which one starts with <span class="chip">${L}</span>?</p>`);
    const pair=add(`<div class="pair"></div>`);
    shuffle([[r.yes,true],[r.no,false]]).forEach(([it,ok])=>{
      const b=el(`<button class="pick"><span class="pic">${it[0]}</span><span>${it[1]}</span></button>`);
      b.onclick=()=>{
        say('w:'+it[1].toLowerCase(),it[1]);
        if(ok){sfx.chime();burst(b);anim(b.firstChild,'jump');b.classList.add('yes');b.lastChild.innerHTML=`<b class="hl">${it[1][0]}</b>${it[1].slice(1)}`;ready();}
        else{sfx.nope();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');}
      };
      pair.appendChild(b);
    });
    cue(`Say both words slowly and stretch the first sound: "${r.yes[1]}... ${r.no[1]}". Hearing first sounds is the skill that comes before reading.`);
  },
  review(s,N){
    add(`<p class="ask">Wake up the sounds you know</p>`);
    const tiles=add(`<div class="tiles"></div>`);let left=N.known.length;
    N.known.split('').forEach(c=>{
      const b=el(`<button class="tile">${c}</button>`);
      b.onclick=()=>{if(!b.classList.contains('lit')){b.classList.add('lit');sfx.pop(N.known.length-left);burst(b,'✨');if(--left===0){sfx.win();ready();}}};
      tiles.appendChild(b);
    });
    cue('He taps a letter, you both say its sound. If he forgets one, just tell him. Quick and cheerful.');
  },
  blend(s,N){
    const b=s.b,n=b.w.length;
    add(`<p class="ask">Slide the dragon to read the word</p>`);
    const box=add(`<div class="blend"><div class="sounds">${b.w.split('').map(c=>`<button>${c}</button>`).join('')}</div><div class="track"><div class="thumb">🐉</div></div><div class="reveal"></div></div>`);
    const track=$('.track',box),thumb=$('.thumb',box),letters=[...box.querySelectorAll('.sounds button')],rev=$('.reveal',box);
    letters.forEach((l,i)=>l.onclick=()=>{l.classList.remove('pop');void l.offsetWidth;l.classList.add('pop','lit');sfx.pop(i);});
    let fin=false,down=false;
    function move(e){
      if(fin)return;const r=track.getBoundingClientRect();
      const f=Math.max(0,Math.min(1,(e.clientX-r.left-30)/(r.width-60)));
      thumb.style.left=(f*(r.width-60))+'px';
      letters.forEach((l,i)=>l.classList.toggle('lit',f>=(i+.35)/n));
      if(f>=.97){
        fin=true;$('.sounds',box).classList.add('done');
        rev.innerHTML=`${b.who?avatar(b.who,84):`<span>${b.e||'⭐'}</span>`}`;rev.classList.add('pop');
        sfx.chime();burst(rev);say('w:'+b.w,b.w);ready();
      }
    }
    track.onpointerdown=e=>{e.preventDefault();down=true;try{track.setPointerCapture(e.pointerId);}catch(_){}move(e);};
    track.onpointermove=e=>{if(down)move(e);};
    track.onpointerup=track.onpointercancel=()=>{down=false;};
    cue(`Say each sound as the dragon passes it, stretching them into each other: "${b.w.split('').join('...')}". Then say it fast: "${b.w}". If he can't blend yet, that is normal at three. You blend, he repeats.`);
  },
  page(s,N){
    const p=s.p,L=N.letter;
    const scene=add(`<div class="scene">${(p.cast||[]).map(w=>`<button class="actor" data-say="${FAMILY[w].name}!">${avatar(w,76)}</button>`).join('')}${glyphs(p.e).map(g=>`<button class="actor" data-say="${SAYS[g]||''}">${g}</button>`).join('')}</div>`);
    scene.onclick=e=>{const a=e.target.closest('.actor');if(!a)return;anim(a);sfx.boing();burst(a);if(a.dataset.say)say('s:'+a.dataset.say,a.dataset.say);};
    const txt=add(`<p class="text">${storyHTML(p.t)}</p>`);
    const words=[...txt.querySelectorAll('.w')],gold=words.filter(w=>w.classList.contains('read')),starred=words.filter(w=>w.classList.contains('s'));
    let found=0,readN=0,hunt=null;
    const pid=`n${cur.i+1}p${N.story.indexOf(p)+1}`,rec=recorded(),times=rec&&rec.pages[pid],clip=`audio/${progress.buddy}/${pid}.mp3`;
    if(times){getAudio(clip);getAudio(`audio/${progress.buddy}/bits.mp3`);}
    const sayWord=w=>{const t=times&&times[words.indexOf(w)];if(t)playSeg(clip,t[0]-.03,t[1]+.04,{onfail:()=>speak(w.dataset.w)});else speak(w.dataset.w);};
    if(L&&starred.length){hunt=add(`<p class="hunt">Tap the words that start with <b>${L}</b> &nbsp;⭐ <span>0</span> of ${starred.length}</p>`);txt.after(hunt);}
    txt.onclick=e=>{
      const w=e.target.closest('.w');if(!w)return;
      if(w.classList.contains('read')){
        soundOut(w.dataset.w,()=>{if(!w.classList.contains('said')){w.classList.add('said');if(++readN===gold.length){sfx.win();ready();}}});
        return;
      }
      sayWord(w);anim(w,'jump');
      if(w.classList.contains('s')&&!w.classList.contains('got')){
        w.classList.add('got');burst(w);sfx.pop(found);$('span',hunt).textContent=++found;
        if(found===starred.length){sfx.win();anim(hunt,'jump');ready();}
      }
    };
    if((canSpeak||times)&&progress.voice){
      const hb=add(`<button class="hear">${buddy().e} ${buddy().name}, read it to me</button>`);
      const mark=i=>words.forEach((w,j)=>w.classList.toggle('now',j===i));
      const phoneRead=()=>{
        const str=plain(p.t);let pos=0;
        const offs=words.map(w=>{const i=str.indexOf(w.dataset.w,pos);if(i>=0)pos=i+w.dataset.w.length;return i;});
        let heard=false,k=0,timer=null;
        const tick=()=>{if(heard||k>=words.length)return;mark(k);timer=setTimeout(tick,(230+words[k].dataset.w.length*60)/buddy().rate);k++;};
        const ok=speak(str,{
          onword:ci=>{heard=true;clearTimeout(timer);let i=-1;offs.forEach((o,j)=>{if(o>=0&&o<=ci)i=j;});mark(i);},
          onend:()=>{clearTimeout(timer);mark(-1);}
        });
        if(ok)tick();
      };
      hb.onclick=()=>{
        if(!times){phoneRead();return;}
        playSeg(clip,0,null,{ontime:t=>{let i=-1;times.forEach((x,j)=>{if(x&&x[0]<=t+.05)i=j;});mark(i);},onend:()=>mark(-1),onfail:()=>{mark(-1);phoneRead();}});
      };
    }
    cue((gold.length?'Tap a gold word to open it up. He taps each letter while you say its sound together, then it snaps into the word. ':'Run your finger under the words as you read. Tap any picture or word and it answers back. ')+(p.q?`Ask: "${p.q}"`:''));
    if(!gold.length&&!hunt)ready();
  },
  reward(s,N){
    progress.done[cur.i]=true;save();
    add(`<p class="ask">You did it, Sonny!</p>`);
    const st=add(`<button class="sticker actor">${N.sticker}</button>`);
    st.onclick=()=>{anim(st);sfx.boing();burst(st);};
    sfx.win();setTimeout(()=>{burst(st);say('l:yay0',buddy().yay[0]);},350);
    add(`<p class="text" style="text-align:center">You earned the <b class="hl">${N.stickerName}</b> sticker.</p>`);
    add(`<p class="soft">${Object.keys(progress.done).length} of ${NIGHTS.length} stickers on the trail</p>`);
    ready();
  },
  sleep(s,N){
    add(`<p class="ask">Three slow dragon breaths</p>`);
    add(`<div class="breath">🐉</div>`);
    add(`<p class="text" style="text-align:center">Breathe in through your nose... and softly blow out the flame.</p>`);
    add(`<p class="soft">Night night, Sonny. See you tomorrow.</p>`);
    ready();
  }
};

/* ---------- sounding out a gold word ---------- */
function soundOut(word,done){
  document.querySelectorAll('.over').forEach(o=>o.remove());
  const w=word.toLowerCase();
  const ov=el(`<div class="over"><p class="ask">Tap each sound</p><div class="sounds">${w.split('').map(c=>`<button>${c}</button>`).join('')}</div><div class="reveal"></div><button class="mini">Close</button></div>`);
  $('#play').appendChild(ov);
  const ls=[...ov.querySelectorAll('.sounds button')];let left=ls.length,fin=false;
  ov.lastChild.onclick=()=>ov.remove();
  ls.forEach((l,i)=>l.onclick=()=>{
    l.classList.remove('pop');void l.offsetWidth;l.classList.add('pop');sfx.pop(i);
    if(fin||l.classList.contains('lit'))return;
    l.classList.add('lit');burst(l,'✨');
    if(--left===0){
      fin=true;
      setTimeout(()=>{
        if(!ov.isConnected)return;
        $('.sounds',ov).classList.add('done');$('.ask',ov).textContent=w;$('.reveal',ov).textContent='⭐';
        sfx.chime();burst($('.sounds',ov));say('w:'+w,w);done();
        setTimeout(()=>ov.remove(),1900);
      },450);
    }
  });
}

/* ---------- grown-ups ---------- */
function renderGrown(){
  const body=$('#grownBody');body.innerHTML='';
  const card=(html)=>{const c=el(`<div class="card">${html}</div>`);body.appendChild(c);return c;};
  card(`<h2>How a night works</h2><p class="soft">One night is about five minutes. Do one, then stop, even if he asks for more. Wanting more tomorrow is the goal.</p>
  <ul><li><b>Meet a sound.</b> One new letter sound, tied to someone or something he loves.</li><li><b>Trace it, find it, hear it.</b> Finger tracing, an egg hunt, and picking the picture that starts with the sound.</li><li><b>Story.</b> You read, or tap the story friend to have them read while the words light up. He can tap every picture and word. Tonight's sound glows gold, and he hunts for the words that start with it.</li><li><b>Blending nights</b> (4, 8, 11, 12). He slides the dragon under the letters to push sounds together into words, then taps the gold words in the story to open them up and sound them out letter by letter.</li></ul>`);
  card(`<h2>What helps most</h2><ul>
  <li><b>Sounds, not letter names.</b> Say "sss", not "ess". Names can come later.</li>
  <li><b>Keep sounds pure.</b> "mmm" not "muh", a clipped "t" not "tuh". It makes blending far easier.</li>
  <li><b>Repeat nights.</b> Doing the same night three or four times is how it sticks. Move on when he says the sound before you do.</li>
  <li><b>Blending takes time.</b> Many children cannot blend sounds until four or older. If he isn't ready, you blend and he echoes. Hearing first sounds and knowing a handful of letters at three and a half is a strong start.</li>
  <li><b>Talk about the story.</b> The questions under each page matter as much as the letters. Follow his answers wherever they go.</li>
  <li><b>Play it in the day too.</b> "I spy something that starts with sss" in the car does the same job.</li></ul>`);
  const ph=card(`<h2>Family photos</h2><p class="soft">Swap the drawings for real faces. Photos are saved on this phone only and are never uploaded.</p>`);
  Object.keys(FAMILY).forEach(k=>{
    const row=el(`<div class="photo-row">${avatar(k,56)}<span class="name">${FAMILY[k].name}</span><label class="btn">Choose photo<input type="file" accept="image/*" id="photo-${k}"></label></div>`);
    $('input',row).onchange=e=>{
      const f=e.target.files&&e.target.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{const im=new Image();im.onload=()=>{
        const c=document.createElement('canvas');c.width=c.height=240;const s=Math.min(im.width,im.height);
        c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);
        const ok=store.set('photo_'+k,c.toDataURL('image/jpeg',.82));
        renderGrown();if(!ok)$('#grownBody').prepend(el(`<p class="cue">This browser would not save the photo. The drawing will be used instead.</p>`));
      };im.src=rd.result;};
      rd.readAsDataURL(f);
    };
    if(store.get('photo_'+k,null)){const rm=el(`<button class="btn">Remove</button>`);rm.onclick=()=>{store.del('photo_'+k);renderGrown();};row.appendChild(rm);}
    ph.appendChild(row);
  });
  const set=card(`<h2>Settings</h2><div class="toggle"><span>Voices and sounds</span><button class="btn" id="voiceBtn">${progress.voice?'On':'Off'}</button></div>
    <div class="toggle"><span>Clear all stickers and start over</span><button class="btn" id="resetBtn">Reset</button></div>`);
  $('#voiceBtn',set).onclick=()=>{progress.voice=!progress.voice;save();renderGrown();};
  const rb=$('#resetBtn',set);
  rb.onclick=()=>{if(rb.dataset.sure){progress.done={};save();renderGrown();}else{rb.dataset.sure='1';rb.textContent='Tap again to reset';}};
}
$('#toGrown').onclick=$('#toGrown2').onclick=()=>show('grown');
$('#closeGrown').onclick=()=>show('home');

show('home');
})();
</script>
