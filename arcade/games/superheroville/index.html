<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Superheroville</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* On-screen buttons, only shown on touch screens (iPad / iPhone). */
    #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    @media (pointer: coarse) { #touch { display: block; } }
    #touch button { position: absolute; bottom: 4vh; width: 15vh; height: 15vh; border-radius: 50%; pointer-events: auto;
      border: 3px solid #ffffff88; background: #ffffff22; color: #fff; font: bold 4vh system-ui, sans-serif;
      touch-action: none; -webkit-user-select: none; user-select: none; }
    #touch button.on { background: #ffd23f66; }
    #t-left { left: 3vw; } #t-right { left: calc(3vw + 17vh); }
    #t-run { right: calc(3vw + 17vh); } #t-jump { right: 3vw; bottom: 12vh !important; }
    #t-pause { top: 2vh; bottom: auto !important; right: 50%; transform: translateX(50%); width: 9vh !important; height: 6vh !important; border-radius: 3vh !important; font-size: 2.4vh !important; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="touch">
    <button id="t-left" data-k="left">&#9664;</button>
    <button id="t-right" data-k="right">&#9654;</button>
    <button id="t-run" data-k="run">B</button>
    <button id="t-jump" data-k="jump">A</button>
    <button id="t-pause" data-k="start">II</button>
  </div>
  <script>
    window.TOUCH_STATE = window.TOUCH_STATE || {};
    document.querySelectorAll('#touch button').forEach(b => {
      const k = b.dataset.k;
      const on = e => { e.preventDefault(); window.TOUCH_STATE[k] = true; b.classList.add('on'); };
      const off = e => { e.preventDefault(); window.TOUCH_STATE[k] = false; b.classList.remove('on'); };
      b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
      b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
    });
  </script>
  <script src="lib/phaser.min.js"></script>
  <script src="src/font.js"></script>
  <script src="src/art.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/controls.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/game.js"></script>
  <script src="src/screens.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
